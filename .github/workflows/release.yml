name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compare the tag and package versions
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

  build:
    name: Build ${{ matrix.asset }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: slur-linux-x64
            executable: slur
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: slur-linux-arm64
            executable: slur
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: slur-macos-x64
            executable: slur
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: slur-macos-arm64
            executable: slur
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: slur-windows-x64
            executable: slur.exe
            archive: zip

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          archive="${{ matrix.asset }}.${{ matrix.archive }}"
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" "${{ matrix.executable }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "${{ matrix.asset }}.${{ matrix.archive }}"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" `
            -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "dist/$archive.sha256"

      - name: Upload the packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          expected_assets=(
            slur-linux-x64.tar.gz
            slur-linux-arm64.tar.gz
            slur-macos-x64.tar.gz
            slur-macos-arm64.tar.gz
            slur-windows-x64.zip
          )

          for asset in "${expected_assets[@]}"; do
            test -f "release/$asset"
            test -f "release/$asset.sha256"
          done

          cd release
          sha256sum --check --strict ./*.sha256
          cat ./*.sha256 | sort -k 2 > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              --draft
          fi

          gh release upload "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
          fi
